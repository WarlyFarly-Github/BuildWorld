name: BuildWorld
version: 1.0.0
main: com.boshywashy.buildworld.BuildWorld
api-version: '1.21'
description: A comprehensive build world management plugin
author: BoshyWashy
softdepend: [WorldGuard, Vault, PlaceholderAPI, floodgate, Geyser-Spigot]
# Downloaded from Maven Central by the server on startup (keep the version in step with build.gradle.kts)
libraries:
  - net.dv8tion:JDA:6.7.0
commands:
  buildworld:
    description: Main BuildWorld command
    aliases: [bw]
    usage: /buildworld <subcommand>
  buildworldadmin:
    description: Admin commands for BuildWorld
    aliases: [bwa]
permissions:
  buildworld.use:
    default: true
  buildworld.admin:
    default: op
  buildworld.spawn:
    default: true
  buildworld.create:
    default: true
  buildworld.bypass:
    default: op