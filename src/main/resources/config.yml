# BuildWorld Configuration
# Primary and Secondary Colors (Minecraft color codes: 0-9, a-f)
Colors:
  Primary: "b"  # Aqua by default
  Secondary: "f" # White by default

# World Settings
World:
  DefaultDiameter: 100
  MaxWorldsPerPlayer: 1
  CreateCooldown: 120 # Seconds between world creations
  # CreationSpeedPercent controls the delay before world creation begins.
  # The actual world creation (Bukkit.createWorld) always runs on the main thread
  # because that is a Bukkit requirement. However, file preparation is done async,
  # and keepSpawnInMemory is disabled to minimise chunk generation work.
  #
  # This setting adds a tick delay before creation starts to give the server
  # time to breathe, and prevents two players from triggering creation at the
  # same time:
  #   100 =   0 ticks delay (immediate — may cause a brief TPS spike)
  #    75 =  25 ticks (~1.25 seconds)
  #    50 =  50 ticks (~2.5 seconds)
  #    25 =  75 ticks (~3.75 seconds)
  #    10 =  90 ticks (~4.5 seconds)
  #     1 =  99 ticks (~5 seconds)
  #
  # Recommended: 50 for busy servers. This does NOT make creation slower for
  # the player — it just staggers multiple creations so the server handles
  # them one at a time.
  CreationSpeedPercent: 50
  VoidWorld:
    GenerateStructures: false
    AllowEntities: false
  Border:
    Enabled: true

# WorldGuard Settings
WorldGuard:
  DefaultFlags:
    passthrough: "deny"
    build: "deny"
    block-break: "deny"
    block-place: "deny"
    use: "allow"
    chest-access: "deny"
    pvp: "deny"

# Online Expansion System
OnlineWorldExpansion:
  Enabled: true
  BlockGainPerMin: 20
  CheckInterval: 60 # seconds

# Discord Expansion Approval
# When BotToken and ChannelId are BOTH set, /bw ExpandWorld no longer expands the border instantly.
# Instead a request with Accept / Decline buttons is posted to the Discord channel, and the border
# only grows once someone presses Accept. Leave either one blank to keep instant expansion.
# After changing these, run /bwa reload (or restart) to reconnect the bot.
#
# Setup: create a bot at https://discord.com/developers/applications, copy its token below,
# invite it to your server, and give it View Channel, Send Messages and Embed Links in the channel.
# KEEP THE TOKEN SECRET - anyone with it controls your bot. If it leaks, reset it in the portal.
Discord:
  BotToken: ""
  ChannelId: ""        # Right-click the channel in Discord (Developer Mode on) > Copy Channel ID
  ReviewerRoleId: ""   # Optional: only members with this role can press the buttons. Blank = anyone who can see the channel.
  # Messages sent to the player. Placeholders:
  #   {discuser} the Discord user who reviewed it   {world} the world's name
  #   {distance} the world's new border size        {blocks} how many blocks were requested
  Messages:
    Accepted: "%primary%{discuser} accepted your expansion request for %secondary%{world}%primary%! You now have %secondary%{distance}%primary%."
    Declined: "&c{discuser} declined your expansion request for {world}."
    Failed: "&cYour expansion request for {world} could not be applied. The world may no longer exist, or you no longer have enough expansion blocks."

# Bedrock Border Particles (GeyserMC)
# Bedrock players can't see the vanilla world border, so they get red particles where it is instead.
# Only Bedrock players see them, and only the part of the border within ViewDistance blocks of them.
# Bedrock players are detected through Floodgate or Geyser if installed.
BedrockBorderParticles:
  Enabled: true
  ViewDistance: 40   # Blocks. How far from the player the border is drawn.
  Spacing: 3         # Blocks between particles. Lower = denser wall, but more load on the server and Geyser.
  UpdateTicks: 10    # How often the particles are redrawn (20 ticks = 1 second).

# Member/Owner Permissions (Nested under buildworld.member and buildworld.owner)
Permissions:
  Member:
    - "worldedit.*"
    - "axiom.*"
    - "arceon.*"
    - "//confirm"
  Owner:
    - "worldedit.*"
    - "axiom.*"
    - "arceon.*"
    - "//confirm"
    - "buildworld.admin.memberedit"

